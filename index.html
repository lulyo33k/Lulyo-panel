<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>monpanel</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23ff9f1c%27/%3E%3Cpath d=%27M9 10l7 6-7 6%27 fill=%27none%27 stroke=%27%2314110a%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3Crect x=%2718%27 y=%2720%27 width=%276%27 height=%273%27 rx=%271%27 fill=%27%2314110a%27/%3E%3Ccircle cx=%2724%27 cy=%279%27 r=%272.2%27 fill=%27%2314110a%27/%3E%3C/svg%3E">
<style>
:root{--bg:#0f0f0e;--s1:#151513;--s2:#1b1b18;--s3:#242420;--bd:#2b2b26;--tx:#e9e7df;--mu:#8b887d;--ac:#ff9f1c;--ok:#86d36f;--ko:#ff6b5e;--wa:#ffc247;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex}
aside{width:230px;flex:none;border-right:1px solid var(--bd);background:var(--s1);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;cursor:pointer}.logo svg{width:28px;height:28px;flex:none}
.wm{font:600 15px var(--mono);letter-spacing:-.02em}.wm b{color:var(--ac);font-weight:600}
.nav,.sa{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;color:var(--mu);cursor:pointer;text-decoration:none;white-space:nowrap;overflow:hidden;border-left:2px solid transparent}
.nav:hover,.sa:hover{background:var(--s2);color:var(--tx)}.nav.on,.sa.on{background:var(--s2);color:var(--tx);border-left-color:var(--ac);border-radius:0 6px 6px 0}
.lbl{font:11px var(--mono);letter-spacing:.08em;color:var(--mu);padding:18px 10px 6px;text-transform:uppercase}
#side{overflow:auto;flex:1}.sa span{overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:#55534a;flex:none}
.dot.running{background:var(--ok)}.dot.installing,.dot.starting{background:var(--wa);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
main{flex:1;min-width:0;padding:32px clamp(16px,4vw,48px);max-width:1100px;margin:auto}
h1{font-size:24px;font-weight:650;letter-spacing:-.01em}.sub{color:var(--mu);margin-top:2px}
.top{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--s2);color:var(--tx);border:1px solid var(--bd);padding:7px 12px;border-radius:6px;cursor:pointer;font:inherit;font-weight:500}
.btn:hover{background:var(--s3);border-color:#3d3d35}
.btn.p{background:var(--ac);border-color:var(--ac);color:#1a1200;font-weight:600}.btn.p:hover{filter:brightness(1.08)}
.btn.ok{color:var(--ok)}.btn.d{color:var(--ko)}.btn.d:hover{background:#ff6b5e14;border-color:#ff6b5e66}.btn.i{padding:7px}
input,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px 11px;font:inherit;outline:0}
input:focus{border-color:var(--ac)}
.stats{display:flex;border:1px solid var(--bd);border-radius:8px;background:var(--s1);margin-bottom:22px;overflow:hidden}
.stat{flex:1;padding:14px 18px;border-right:1px solid var(--bd)}.stat:last-child{border:0}
.stat b{font:600 26px var(--mono);display:block;line-height:1.2}.stat span{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:16px}
.card.h:hover{border-color:#4a4636}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:4px;background:var(--s3);color:var(--mu)}
.pill.running{color:var(--ok);background:#86d36f14}.pill.installing,.pill.starting{color:var(--wa);background:#ffc24714}
.chip{font:12px var(--mono);color:var(--mu);background:var(--s2);border:1px solid var(--bd);padding:2px 7px;border-radius:4px}
.empty{text-align:center;padding:56px 20px;color:var(--mu);border:1px dashed var(--bd);border-radius:8px}.empty .big{color:var(--ac);margin-bottom:6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin:22px 0 16px}
.tab{padding:9px 14px;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--tx)}.tab.on{color:var(--tx);border-color:var(--ac)}
.term{background:#0a0a09;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.th{display:flex;align-items:center;gap:6px;padding:7px 10px 7px 14px;background:var(--s1);border-bottom:1px solid var(--bd)}
.th i{display:none}.th small{color:var(--mu);font-family:var(--mono)}
#log{height:min(52vh,520px);overflow:auto;padding:12px 14px;font:13px/1.55 var(--mono);color:#cfccc1}
#log div{white-space:pre-wrap;word-break:break-word;min-height:1.55em}#log .p{color:var(--ac)}#log .e{color:var(--ko)}#log .w{color:var(--wa)}
.ci{display:flex;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid var(--bd);background:var(--s1)}.ci input{flex:1;border:0;background:none;font-family:var(--mono);padding:4px}.ci b{color:var(--ac);font-family:var(--mono)}
.crumbs{display:flex;gap:2px;flex-wrap:wrap;align-items:center;color:var(--mu);font-family:var(--mono);font-size:13px}.crumbs a{cursor:pointer;padding:2px 6px;border-radius:4px}.crumbs a:hover{background:var(--s3);color:var(--tx)}.crumbs a:last-child{color:var(--tx)}
.f{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:6px;cursor:pointer}
.f:hover{background:var(--s2)}.f .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:13px}.f small{color:var(--mu);font-family:var(--mono)}.f .btn{opacity:0}.f:hover .btn{opacity:1}
.fi{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;background:var(--s3);color:var(--mu);flex:none}.fi.d{color:var(--ac)}.fi.py{color:#6aa9e8}.fi.cfg{color:var(--ok)}
.dz{border:1px dashed #3d3d35;border-radius:8px;padding:18px;text-align:center;color:var(--mu);margin-bottom:12px;cursor:pointer}.dz:hover{border-color:var(--ac);color:var(--tx)}
#ov{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:16px;z-index:50}#ov.on{display:grid}
.mod{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:20px;width:min(440px,100%);box-shadow:0 24px 60px #000a}.mod.w{width:min(980px,100%)}
.mod h3{font-size:17px;margin-bottom:6px}.mod p{color:var(--mu);margin-bottom:14px}.mod input{width:100%;margin-bottom:16px}
.code{display:flex;height:60vh;border:1px solid var(--bd);border-radius:8px;background:#0a0a09;overflow:hidden;margin:12px 0 0;font:13px/1.55 var(--mono)}
.gut{padding:12px 10px 40px;color:#57554b;text-align:right;user-select:none;overflow:hidden;white-space:pre;flex:none;border-right:1px solid var(--bd);min-width:44px}
.ed{position:relative;flex:1;overflow:hidden}
#hl,#ed{position:absolute;inset:0;margin:0;padding:12px 12px 40px;font:inherit;white-space:pre;tab-size:4;border:0;border-radius:0;letter-spacing:0}
#hl{pointer-events:none;color:#d4d1c6;overflow:hidden}
#ed{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--ac);resize:none;overflow:auto}
#ed::selection{background:#ff9f1c40}
.tk{color:#ff8a65}.ts{color:#a5d17f}.tc{color:#6c6a5f;font-style:italic}.tn{color:#e8c26a}.td{color:#e8c26a}.tf{color:#6aa9e8}.tb{color:#4fc1c7}.tv{color:#e5738a}.tfn{color:#8cb9f0}
#dzo{position:fixed;inset:12px;border:2px dashed var(--ac);border-radius:12px;background:#ff9f1c14;display:none;place-items:center;font:600 20px var(--mono);z-index:40;pointer-events:none}
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--s3);border:1px solid var(--bd);border-left:3px solid var(--ac);padding:10px 14px;border-radius:6px;box-shadow:0 10px 30px #0008}.toast.e{border-left-color:var(--ko)}
@media(max-width:800px){aside{display:none}body{display:block}}
#auth{display:none;min-height:100vh;place-items:center;padding:16px;width:100%}body.locked #auth{display:grid}body.locked aside,body.locked main{display:none}
.authc{width:min(380px,100%);background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:10px;animation:pop .25s}
.authc h2{font-size:19px}.authc p{color:var(--mu);margin:-4px 0 6px}.alt{color:var(--mu);text-align:center;cursor:pointer;font-size:13px;margin-top:4px}.alt:hover{color:var(--ac)}
.uchip{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--bd)}.uchip>div{flex:1;min-width:0;line-height:1.25}.uchip b{display:block;overflow:hidden;text-overflow:ellipsis}.uchip small{color:var(--mu)}
main.out{opacity:0;transform:translateY(8px);transition:opacity .11s,transform .11s}
main.in{animation:pgin .3s cubic-bezier(.2,.7,.2,1)}
@keyframes pgin{from{opacity:0;transform:translateY(12px)}}@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}}
#p1,#p2,#p3{animation:pgin .25s cubic-bezier(.2,.7,.2,1)}#ov.on{animation:fade .15s}.mod{animation:pop .18s}
input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--ac)}
select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px 11px;font:inherit}
.pill.ok{color:var(--ok);background:#86d36f14}.pill.ko{color:var(--ko);background:#ff6b5e14}.pill.ac{color:var(--ac);background:#ff9f1c14}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font:11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mu);padding:10px 14px;border-bottom:1px solid var(--bd);white-space:nowrap}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--bd);font-size:13px;white-space:nowrap}.tbl tr:last-child td{border:0}.tbl td.m{font-family:var(--mono);color:var(--mu)}.tbl tbody tr:hover{background:var(--s2)}
.bars{display:flex;gap:16px;align-items:flex-end;height:120px}.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bg{flex:1;display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center}.bg i{width:12px;min-height:2px;border-radius:2px 2px 0 0;background:var(--ok);transition:height .5s}.bg i.f{background:var(--ko)}.bg i.s{background:var(--ac)}.bc small{color:var(--mu);font:11px var(--mono)}
@media(max-width:800px){aside{display:flex;position:static;width:auto;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--bd)}.lbl,#side{display:none}.logo{padding:0 10px 0 0}.uchip{margin-left:auto;border:0;padding:0}main{padding-top:20px}}
.stats{flex-wrap:wrap}.stat{min-width:200px}.stat small{display:block;color:var(--mu);font:12px var(--mono);text-transform:none;letter-spacing:0}
.bar{height:4px;background:var(--s3);border-radius:2px;margin:8px 0 6px;overflow:hidden}.bar i{display:block;height:100%;transition:width .6s,background .3s}
.cores{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:12px}.core small{color:var(--mu);font:11px var(--mono)}.core b{font:600 13px var(--mono);float:right}
</style></head><body>
<aside><div class="logo" onclick="location.hash='#/'"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#ff9f1c"/><path d="M9 10l7 6-7 6" fill="none" stroke="#14110a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="18" y="20" width="6" height="3" rx="1" fill="#14110a"/><circle cx="24" cy="9" r="2.2" fill="#14110a"/></svg><span class="wm">mon<b>panel</b></span></div>
<a class="nav" id="nh" href="#/"></a><a class="nav" id="ns" href="#/server"></a><a class="nav" id="nm" href="#/monitoring"></a><a class="nav" id="nu" href="#/users"></a><div class="lbl">Mes apps</div><div id="side"></div><div class="uchip" id="uchip"></div></aside>
<main id="app"></main><div id="auth"></div><div id="ov"></div><div id="dzo">Dépose tes fichiers ici</div><div id="toasts"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={play:'<polygon points="6 4 20 12 6 20"/>',stop:'<rect x="5" y="5" width="14" height="14" rx="2"/>',re:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>',trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/>',plus:'<path d="M12 5v14M5 12h14"/>',up:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',term:'<path d="M4 17l6-5-6-5M12 19h8"/>',back:'<path d="M15 18l-6-6 6-6"/>',copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',dl:'<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>',edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'};
const ic=(n,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const L={running:'En ligne',stopped:'Arrêté',installing:'Installation…',starting:'Démarrage…'};
const pill=s=>`<span class="pill ${s}"><span class="dot ${s}"></span>${L[s]||s}</span>`;
let timer,cur='',offset=0,appName='',editPath='',pend='',tabN=1,apps=[],q='';
function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' e':'');t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),3500)}
async function api(u,o={}){if(o.json){o.body=JSON.stringify(o.json);o.headers={'Content-Type':'application/json'};delete o.json}
 const r=await fetch('/api'+u,o),j=await r.json().catch(()=>({}));if(!r.ok){if(r.status==401&&u!='/login'){me=null;boot();throw new Error('401')}toast(j.error||'Erreur',1);throw new Error(j.error)}return j}
function ask({title,text='',input,ok='OK',danger,pw}){return new Promise(res=>{const o=$('#ov');
 o.innerHTML=`<div class="mod"><h3>${title}</h3><p>${text}</p>${input!=null?`<input id="mi" ${pw?'type="password" ':''}placeholder="${input}" autocomplete="off">`:''}
 <div class="row" style="justify-content:flex-end"><button class="btn" id="mc">Annuler</button><button class="btn ${danger?'d':'p'}" id="mo">${ok}</button></div></div>`;
 o.classList.add('on');const c=v=>{o.classList.remove('on');res(v)},i=$('#mi');i&&i.focus();
 $('#mc').onclick=()=>c(null);$('#mo').onclick=()=>c(i?i.value.trim()||null:true);
 i&&(i.onkeydown=e=>{if(e.key=='Enter')$('#mo').click();if(e.key=='Escape')c(null)});o.onmousedown=e=>{if(e.target==o)c(null)}})}
async function side(){if(!me)return;apps=await api('/apps').catch(()=>apps);const cur_=decodeURIComponent((location.hash.match(/^#\/app\/(.+)$/)||[])[1]||'');
 navs();
 $('#side').innerHTML=apps.map(a=>`<a class="sa ${a.name==cur_?'on':''}" href="#/app/${encodeURIComponent(a.name)}"><span class="dot ${a.status}"></span><span>${E(a.name)}</span></a>`).join('')||'<div style="color:var(--mu);padding:8px 10px;font-size:13px">Aucune app</div>'}


async function home(){
 $('#app').innerHTML=`<div class="top"><div><h1>Tableau de bord</h1><div class="sub">Gère tes bots et tes apps Python depuis un seul endroit.</div></div><div class="sp"></div>
 <button class="btn p" onclick="createApp()">${ic('plus')}Nouvelle app</button></div>
 <div class="stats" id="stats"></div><div class="row" style="margin-bottom:14px;position:relative"><input id="sq" placeholder="Rechercher une app…" style="width:100%;max-width:340px" oninput="q=this.value;draw()" value="${E(q)}"></div><div class="grid" id="grid"></div>`;
 draw();timer=setInterval(draw,2500)}
function draw(){const g=$('#grid');if(!g)return;const run=apps.filter(a=>a.status=='running').length;
 $('#stats').innerHTML=[['Apps',apps.length],['En ligne',run],['Arrêtées',apps.length-run]].map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
 const l=apps.filter(a=>a.name.toLowerCase().includes(q.toLowerCase()));
 g.innerHTML=l.length?l.map(x=>`<div class="card h"><div class="row"><b style="font-size:16px">${E(x.name)}</b><span class="sp"></span>${pill(x.status)}</div>
 <div style="margin:10px 0 16px"><span class="chip">${E(x.entry)}</span></div><div class="row">
 <button class="btn p" onclick="location.hash='#/app/${encodeURIComponent(x.name)}'">Gérer</button>
 ${x.status=='stopped'?`<button class="btn i ok" title="Démarrer" onclick="ctl('${x.name}','start')">${ic('play')}</button>`:`<button class="btn i d" title="Arrêter" onclick="ctl('${x.name}','stop')">${ic('stop')}</button>`}
 <button class="btn i" title="Redémarrer" onclick="ctl('${x.name}','restart')">${ic('re')}</button><span class="sp"></span>
 ${me.role=='admin'||(me.owned||[]).includes(x.name)?`<button class="btn i d" title="Supprimer" onclick="delApp('${x.name}')">${ic('trash')}</button>`:''}</div></div>`).join('')
 :`<div class="empty" style="grid-column:1/-1"><div class="big">${ic('term',40)}</div><p style="margin:8px 0 16px">${apps.length?'Aucun résultat.':'Aucune app pour l\'instant. Crée la première !'}</p>${apps.length?'':`<button class="btn p" onclick="createApp()">${ic('plus')}Nouvelle app</button>`}</div>`}
async function createApp(){const n=await ask({title:'Nouvelle app',text:'Un environnement virtuel Python sera créé automatiquement.',input:'nom-de-l-app',ok:'Créer'});if(!n)return;
 toast('Création de l\'environnement…');try{await api('/apps',{method:'POST',json:{name:n}});me=await fetch('/api/me').then(x=>x.json());location.hash='#/app/'+encodeURIComponent(n)}catch(e){}}
async function ctl(n,a){await api(`/apps/${n}/${a}`,{method:'POST'});await side();route(1)}
async function delApp(n){if(await ask({title:'Supprimer « '+E(n)+' » ?',text:'Tous ses fichiers et son environnement seront effacés.',ok:'Supprimer',danger:1})){await api('/apps/'+n,{method:'DELETE'});toast('App supprimée');location.hash='#/';route()}}

async function appPage(n){const my=navId;appName=n;cur='';offset=0;pend='';tabN=1;const i=await api(`/apps/${n}/info`);if(my!=navId)return;
 $('#app').innerHTML=`<a class="btn" href="#/" style="margin-bottom:18px">${ic('back')}Retour</a>
 <div class="top"><div><h1>${E(n)}</h1><div class="row" style="margin-top:8px"><span id="st">${pill(i.status)}</span><span class="chip">python · venv</span></div></div><div class="sp"></div>
 <button class="btn p" onclick="ctl2('start')">${ic('play')}Démarrer</button><button class="btn" onclick="ctl2('restart')">${ic('re')}Redémarrer</button><button class="btn d" onclick="ctl2('stop')">${ic('stop')}Arrêter</button></div>
 <div class="card row"><span style="color:var(--mu)">Fichier de démarrage</span><input id="entry" value="${E(i.entry)}" style="width:200px;font-family:ui-monospace,monospace"><button class="btn" onclick="saveEntry()">Enregistrer</button></div>

 let o='',i=0,prev='',m;while(m=re.exec(src)){o+=E(src.slice(i,m.index));i=re.lastIndex;const t=m[0];let c='';
  if(m[1])c='c';else if(m[2])c='s';else if(m[3])c='d';else if(m[4])c='n';
  else if(prev=='def'||prev=='class')c='f';else if(KW.has(t))c='k';else if(t=='self'||t=='cls')c='v';else if(BI.has(t))c='b';else if(src[i]=='(')c='fn';
  prev=m[5]?t:'';o+=c?`<span class="t${c}">${E(t)}</span>`:E(t)}
 return o+E(src.slice(i))}

const fmtB=n=>{const u=['o','Ko','Mo','Go','To'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i>1?1:0)+' '+u[i]};
const dur=s=>{s=Math.floor(s);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d} j ${h} h`:h?`${h} h ${m} min`:m?`${m} min`:`${s} s`};
function spark(series,mx){const w=300,h=80;let o='';for(const [v,c] of series){const n=v.length;if(n<2)continue;
 const l=v.map((y,i)=>(i?'L':'M')+(i/(n-1)*w).toFixed(1)+' '+(h-Math.min(y/mx,1)*(h-3)).toFixed(1)).join('');
 o+=`<path d="${l}L${w} ${h}L0 ${h}Z" fill="${c}" opacity=".1"/><path d="${l}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`}
 return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:80px;display:block;margin-top:12px">${o}</svg>`}
const gauge=(l,v,p,sub)=>`<div class="stat"><span>${l}</span><b style="color:${col(p)}">${v}</b><div class="bar"><i style="width:${Math.min(p,100)}%;background:${col(p)}"></i></div><small>${sub}</small></div>`;
async function server(){const my=navId;
 $('#app').innerHTML=`<div class="top"><div><h1>Serveur</h1><div class="sub" id="sinfo">&nbsp;</div></div></div>
 <div class="stats" id="sg"></div><div class="grid" id="sc" style="margin-bottom:14px"></div>
 <div class="card" style="margin-bottom:14px"><b>Cœurs CPU</b><div class="cores" id="scores" style="margin-top:14px"></div></div>
 <div class="card" style="padding:0;overflow-x:auto"><table class="tbl"><thead><tr><th>App en cours</th><th>État</th><th>PID</th><th>CPU</th><th>RAM</th><th>Actif depuis</th></tr></thead><tbody id="sapps"></tbody></table></div>`;
 await loadSrv();if(my!=navId)return;timer=setInterval(loadSrv,2000)}
async function loadSrv(){const d=await api('/system');if(!$('#sg'))return;const h=d.hist,last=a=>a[a.length-1]||0;
 $('#sinfo').textContent=`${d.node} · ${d.os} · ${d.cores} cœurs · allumé depuis ${dur(d.uptime)}`+(d.load?` · charge ${d.load.map(x=>x.toFixed(2)).join(' ')}`:'');
 $('#sg').innerHTML=gauge('CPU',d.cpu.toFixed(0)+' %',d.cpu,d.temp!=null?d.temp.toFixed(0)+' °C':d.cores+' cœurs')
  +gauge('RAM',d.ram.percent.toFixed(0)+' %',d.ram.percent,fmtB(d.ram.used)+' / '+fmtB(d.ram.total))
  +gauge('Disque',d.disk.percent.toFixed(0)+' %',d.disk.percent,fmtB(d.disk.used)+' / '+fmtB(d.disk.total))
  +`<div class="stat"><span>Réseau</span><b style="font-size:19px;line-height:1.9">↓ ${fmtB(last(h.rx))}/s</b><small>↑ ${fmtB(last(h.tx))}/s</small></div>`;
 const cc=(t,s,sub)=>`<div class="card"><div class="row"><b>${t}</b><span class="sp"></span><small style="color:var(--mu)">${sub}</small></div>${s}</div>`,mxn=Math.max(1024,...h.rx,...h.tx);
 $('#sc').innerHTML=cc('CPU',spark([[h.cpu,'#ff9f1c']],100),'5 dernières minutes')+cc('RAM',spark([[h.ram,'#4fc1c7']],100),'5 dernières minutes')+cc('Réseau',spark([[h.rx,'#86d36f'],[h.tx,'#ff9f1c']],mxn),'↓ reçu · ↑ envoyé');
 $('#scores').innerHTML=d.cores_pct.map((v,i)=>`<div class="core"><small>C${i}</small><b>${v.toFixed(0)}%</b><div class="bar"><i style="width:${v}%;background:${col(v)}"></i></div></div>`).join('');
 $('#sapps').innerHTML=d.apps.map(a=>`<tr><td><a href="#/app/${encodeURIComponent(a.name)}" style="color:var(--tx)">${E(a.name)}</a></td><td><span class="pill running">En ligne</span></td><td class="m">${a.pid}</td><td class="m">${a.cpu.toFixed(1)} %</td><td class="m">${fmtB(a.rss)}</td><td class="m">${dur(a.age)}</td></tr>`).join('')
  ||'<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--mu)">Aucune app en cours d\'exécution.</td></tr>'}
addEventListener('hashchange',()=>route());boot();setInterval(side,3000);
</script></body></html>
